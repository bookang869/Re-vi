version: '3.8'

services:
  # ----------------------------------------------------
  # 1. OpenTelemetry Collector (The Ingestion Protocol)
  # ----------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: revi-otel-collector
    restart: always
    mem_limit: 128m
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver port (Highly recommended for speed)
      - "4318:4318"   # OTLP HTTP receiver port
      - "8889:8889"   # Prometheus metrics exporter internal endpoint
    networks:
      - revi-network

  # ----------------------------------------------------
  # 2. VictoriaMetrics (High-Performance Metrics Storage)
  # ----------------------------------------------------
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: revi-victoria-metrics
    restart: always
    mem_limit: 256m
    volumes:
      - vm-data:/victoria-metrics-data
      - ./vm-scrape.yml:/etc/victoriametrics/vm-scrape.yml:ro
    ports:
      - "8428:8428"   # Web UI, Prometheus API query, & Influx native endpoints
    command:
      - "--storageDataPath=/victoria-metrics-data"
      # Scrape the Prometheus-format endpoint the Otel Collector exports on :8889
      - "--promscrape.config=/etc/victoriametrics/vm-scrape.yml"
    networks:
      - revi-network

  # ----------------------------------------------------
  # 3. NATS JetStream (The Resilient Message Buffer)
  # ----------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: revi-nats-queue
    restart: always
    mem_limit: 128m
    ports:
      - "4222:4222"   # NATS client connections
      - "8222:8222"   # HTTP Monitoring server console
    command: ["-js"]  # Explicitly enables the JetStream persistence engine
    volumes:
      - nats-data:/data
    networks:
      - revi-network

  # ----------------------------------------------------
  # 3b. VictoriaLogs (Log storage; the Collector forwards logs here
  #     for the Gateway's trace_id enrichment query — TRD FR-01b)
  # ----------------------------------------------------
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: revi-victoria-logs
    restart: always
    mem_limit: 256m
    volumes:
      - vl-data:/victoria-logs-data
    ports:
      - "9428:9428"   # HTTP query API + OTLP log ingestion endpoint
    command:
      - "--storageDataPath=/victoria-logs-data"
    networks:
      - revi-network

  # ----------------------------------------------------
  # 4. vmalert (Evaluates Alerting Rules Against VictoriaMetrics)
  # ----------------------------------------------------
  vmalert:
    image: victoriametrics/vmalert:v1.99.0
    container_name: revi-vmalert
    restart: always
    mem_limit: 128m
    volumes:
      - ./vmalert-rules.yml:/etc/vmalert/rules.yml:ro
    command:
      - "--datasource.url=http://victoria-metrics:8428"
      - "--notifier.url=http://alertmanager:9093"
      - "--rule=/etc/vmalert/rules.yml"
      - "--evaluationInterval=30s"
    networks:
      - revi-network
    depends_on:
      - victoria-metrics
      - alertmanager

  # ----------------------------------------------------
  # 5. Alertmanager (Routes Firing Alerts to the Gateway)
  # ----------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: revi-alertmanager
    restart: always
    mem_limit: 128m
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Operator-provided file containing REVI_WEBHOOK_SECRET's value, not committed to git.
      - ./secrets/revi_webhook_secret:/etc/alertmanager/secrets/revi_webhook_secret:ro
      # Notification/silence state (image's default --storage.path=/alertmanager).
      # Added PLAN 6.11 Part B: only safe now that the stack runs continuously on
      # a VPS (6.1) instead of being restarted at will during laptop rehearsals —
      # see PLAN.md for why this was deliberately deferred until then.
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - revi-network

  # ----------------------------------------------------
  # 6. Go Ingestion Gateway (HTTP ingest, NATS dispatcher,
  #    digest cron — all three in one binary, TRD Sec 2)
  # ----------------------------------------------------
  gateway:
    build: ./gateway
    container_name: revi-gateway
    restart: always
    mem_limit: 128m
    ports:
      - "8080:8080"   # Alertmanager -> /v1/alerts, GHA runner -> /v1/digest/entry, VM -> /metrics
    environment:
      REVI_WEBHOOK_SECRET: ${REVI_WEBHOOK_SECRET:?set in .env or the shell environment}
      GITHUB_TOKEN_DISPATCH: ${GITHUB_TOKEN_DISPATCH:?set in .env or the shell environment}
      REVI_GITHUB_OWNER: ${REVI_GITHUB_OWNER:?set in .env or the shell environment}
      REVI_GITHUB_REPO: ${REVI_GITHUB_REPO:?set in .env or the shell environment}
      REVI_MODE: ${REVI_MODE:-PR_REVIEW}
      REVI_DIGEST_TIME: ${REVI_DIGEST_TIME:-08:00}
      SLACK_DIGEST_WEBHOOK_URL: ${SLACK_DIGEST_WEBHOOK_URL:-}
      REVI_ESCALATION_WEBHOOK_URL: ${REVI_ESCALATION_WEBHOOK_URL:-}
      REVI_ESCALATION_WEBHOOK_SECRET: ${REVI_ESCALATION_WEBHOOK_SECRET:-}
      REVI_SQLITE_PATH: /data/revi.db
    volumes:
      - gateway-data:/data
    networks:
      - revi-network
    depends_on:
      - nats
      - victoria-logs

  # ----------------------------------------------------
  # 7. Tailscale Funnel (exposes gateway:8080 publicly via a stable
  #    *.ts.net URL so the GitHub-hosted runner can reach
  #    /v1/digest/entry — PLAN 5.1)
  # ----------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: revi-tailscale
    hostname: revi-gateway
    restart: always
    mem_limit: 128m
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set in .env or the shell environment}
      TS_HOSTNAME: revi-gateway
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    networks:
      - revi-network
    depends_on:
      - gateway

volumes:
  vm-data:
    driver: local
  tailscale-state:
    driver: local
  vl-data:
    driver: local
  nats-data:
    driver: local
  gateway-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  revi-network:
    driver: bridge